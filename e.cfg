# sniff.cfg — Serial protocol parse rules
# Format:  {filter,...} [type] [type(label)] ...   # rule_name
#
# Filters  (inside {}, comma-separated, AND logic):
#   len=N          total packet length == N
#   idxN=0xVV      byte[N] == 0xVV  (hex or decimal)
#
# Field types  (inside []):
#   u8  s8
#   u16  s16  u32  s32        uses global endian (-lemode/-bemode)
#   u16le  u16be  etc.        per-field override
#   float  double
#   array-N                   N raw bytes, hex dump only (no endian)
#   array-N(label)            same, with a name
#
# Comments: lines starting with # or ;
# Inline comment after rule: ... # rule_name_here


# ── Example 1: sensor packet ───────────────────────────────────────────────
# Filter: length=18, first two bytes 0xAA and 0xA5 (sync pattern)
# Fields: head (u16), cmd (u16), skip 12 bytes (array), crc (u16)
{len=18, idx0=0xAA, idx1=0xA5} [u16(head)] [u16(cmd)] [array-12] [u16(crc)]  # ZkLED

# ── Example 2: motor command (big-endian speed) ───────────────────────────
# Triggered only when byte[0]==0xA0
{idx0=0xA0} [u8(id)] [u8(cmd)] [s16be(speed)]  # motor_cmd

# ── Example 3: raw 4-byte float, no length filter ─────────────────────────
{len=4} [float(value)]  # float32_packet

# ── Example 4: multi-condition filter ─────────────────────────────────────
# Must be 8 bytes, first byte 0xFF, third byte 0x02
{len=8, idx0=0xFF, idx2=0x02} [u8(hdr)] [u8(flags)] [u8(type)] [s16(x)] [s16(y)] [u8(crc)]  # position_frame
