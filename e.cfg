# sniff.cfg — Serial protocol parse rules
# Format:  {filter,...} [type] [type(label)] ...   # rule_name
#
# Filters  (inside {}, comma-separated, AND logic):
#   len=N          total packet length == N
#   idxN=0xVV      byte[N] == 0xVV  (hex or decimal)
#
# Field types  (inside []):
#   u8  s8
#   u16  s16  u32  s32        uses global endian (-lemode/-bemode)
#   u16le  u16be  etc.        per-field override
#   float  double
#   array-N                   N raw bytes, hex dump only (no endian)
#   array-N(label)            same, with a name
#
# Comments: lines starting with # or ;
# Inline comment after rule: ... # rule_name_here

# ── sensor packet ──────────────────────────────────────────────────────────
# [0]     addr     u8
# [1-2]   voltage  u16 (global endian)
# [3-4]   temp     s16 (global endian)
# [5-8]   ts       u32 (global endian)
{len=9, idx0=0x01} [u8(addr)] [u16(voltage)] [s16(temp)] [u32(timestamp)]  # sensor_data

# ── motor command with per-field endian override ───────────────────────────
{idx0=0xA0} [u8(id)] [u8(cmd)] [s16be(speed)]  # motor_cmd

# ── long frame: header + 8-byte payload array + checksum ──────────────────
# array-N consumes exactly N bytes and prints them as hex (no endian concern)
{len=12, idx0=0xFF} [u8(hdr)] [u8(flags)] [array-8(payload)] [u8(crc)]  # long_frame

# ── pure float packet ──────────────────────────────────────────────────────
{len=4} [float(value)]  # float32

# ── big data frame: two arrays ─────────────────────────────────────────────
{len=20, idx0=0x55} [u8(id)] [u16(seq)] [array-12(data)] [u32be(checksum)]  # data_frame

# ── position frame: multi-condition filter ─────────────────────────────────
{len=8, idx0=0xFE, idx2=0x03} [u8(hdr)] [u8(flags)] [u8(type)] [s16(x)] [s16(y)] [u8(crc)]  # position
