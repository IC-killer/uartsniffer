# sniff.cfg — Serial protocol parse rules
# Format: {filter,...} [type] [type(label)] ...   # rule_name
#
# Filters (inside {}, AND-combined):
#   len=N          packet total length == N
#   idxN=0xVV      byte at index N == 0xVV (hex or decimal)
#
# Field types: u8 s8 u16 s16 u16be s16be u32 s32 u32be s32be float double
# (label) after type gives the field a name: [u16(voltage)]
#
# Lines starting with # or ; are comments.
# Inline comment after rule: ... # name shown in output

# ── Example 1: sensor packet ───────────────────────────────────────────────
# Byte layout: [0] addr u8 | [1-2] voltage u16LE | [3-4] temp s16LE | [5-8] timestamp u32LE
{len=17, idx0=0xaa idx1=0xa5} [u16(head)] [array-13(skip)] [u16(crc)]  # ZkLED

# ── Example 2: motor command (big-endian speed) ───────────────────────────
# Triggered only when byte[0]==0xA0
{idx0=0xA0} [u8(id)] [u8(cmd)] [s16be(speed)]  # motor_cmd

# ── Example 3: raw 4-byte float, no length filter ─────────────────────────
{len=4} [float(value)]  # float32_packet

# ── Example 4: multi-condition filter ─────────────────────────────────────
# Must be 8 bytes, first byte 0xFF, third byte 0x02
{len=8, idx0=0xFF, idx2=0x02} [u8(hdr)] [u8(flags)] [u8(type)] [s16(x)] [s16(y)] [u8(crc)]  # position_frame
